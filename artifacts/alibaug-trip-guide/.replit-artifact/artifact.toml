kind = "web"
previewPath = "/"
title = "Alibaug Trip Guide"
description = "A mobile-first guide to a four-day Alibaug trip for two, with the exact itinerary, practical prep checklists, saved stamps, travel links, and an immersive coastal journey."
version = "1.0.0"
id = "artifacts/alibaug-trip-guide"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22981

[services.development]
run = "pnpm --filter @workspace/alibaug-trip-guide run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/alibaug-trip-guide", "run", "build" ]
serve = "static"
publicDir = "artifacts/alibaug-trip-guide/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22981"
BASE_PATH = "/"
